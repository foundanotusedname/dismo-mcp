[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dismo-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for the rspatial/dismo species distribution modeling package"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dismo-mcp contributors" }]
dependencies = [
  "fastmcp>=3.4.7,<4",
  "mcp>=1.24,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
dismo-mcp = "dismo_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dismo_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/dismo_mcp/r/bridge.R" = "dismo_mcp/r/bridge.R"
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a local R runtime with dismo example data",
]
